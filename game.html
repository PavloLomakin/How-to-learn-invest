<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Смайлик и доллары — с изображением Баффета</title>
<style>
  html,body { height:100%; margin:0; background:#0b1220; color:#fff; font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
  #gameWrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px; }
  canvas { background: linear-gradient(180deg,#052 0%, #013 100%); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.6); max-width:100%; touch-action:none; }
  .hud { display:flex; gap:8px; align-items:center; font-weight:700; flex-wrap:wrap; }
  .btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); color:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .btn:hover { background:rgba(255,255,255,0.09); }
  .info { font-size:14px; opacity:.95; }
  #fileLabel { display:inline-flex; gap:8px; align-items:center; }
  input[type="file"]{ display:none; }
  #leaderboardModal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:50; visibility:hidden; opacity:0; transition:opacity .18s ease, visibility .18s; }
  #leaderboardModal.show { visibility:visible; opacity:1; }
  .modal { background:linear-gradient(180deg,#0f1724,#07101a); border-radius:12px; padding:18px; width:min(720px,94%); color:#fff; box-shadow:0 12px 40px rgba(0,0,0,.7); }
  .modal h2 { margin:0 0 8px 0; font-size:20px; }
  .modal .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .modal input[type="text"]{ padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); color:#fff; min-width:160px; }
  .modal .leaderList { max-height:320px; overflow:auto; margin-top:8px; border-radius:8px; background:rgba(255,255,255,0.02); padding:8px; }
  .leaderItem { display:flex; justify-content:space-between; padding:6px 8px; border-bottom:1px dashed rgba(255,255,255,0.03); font-size:14px; }
  .small { font-size:13px; opacity:.9; }
  @media (max-width:600px){ canvas{ width:320px; height:480px; } .modal{ padding:12px; } }
</style>
</head>
<body>
<div id="gameWrap">
  <div class="hud">
    <div class="info">Счёт: <span id="score">0</span></div>
    <div class="info">Жизни: <span id="lives">3</span></div>
    <div class="info small">Время: <span id="time">0.0</span> с</div>
    <div class="info small">Бессмертие: <span id="invTimer">0.0</span> с</div>
    <button id="restart" class="btn">Перезапустить</button>
    <button id="showBoard" class="btn">Leaderboard</button>
    <label id="fileLabel" class="btn" title="Загрузить изображение для бонуса">
      <span id="fileLabelText">Загрузить изображение</span>
      <input id="buffFile" type="file" accept="image/*" />
    </label>
  </div>
  <canvas id="c" width="800" height="520"></canvas>
  <div class="info">Управление: стрелки или WASD; на мобильных — касание. Лови бонусный смайлик для бессмертия.</div>
</div>

<!-- Модальное окно Leaderboard -->
<div id="leaderboardModal" role="dialog" aria-modal="true">
  <div class="modal" id="modalContent">
    <h2>Leaderboard — Топ 20</h2>
    <div class="row">
      <div class="small">Твой счёт: <strong id="finalScore">0</strong></div>
      <input id="playerName" type="text" placeholder="Введи имя (макс 20 символов)" maxlength="20" />
      <button id="saveScore" class="btn">Сохранить</button>
      <button id="closeBoard" class="btn">Закрыть</button>
    </div>
    <div class="row small">Лучшие результаты сохраняются локально в браузере. Топ-20 сортируется по убыванию очков.</div>
    <div class="leaderList" id="leaderList" aria-live="polite"></div>
  </div>
</div>

<script>
/* Игра с возможностью загрузить своё изображение для бонусного смайлика.
   Если изображение не загружено — используется эмодзи. */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const timeEl = document.getElementById('time');
const invTimerEl = document.getElementById('invTimer');
const restartBtn = document.getElementById('restart');
const showBoardBtn = document.getElementById('showBoard');

const modal = document.getElementById('leaderboardModal');
const leaderListEl = document.getElementById('leaderList');
const finalScoreEl = document.getElementById('finalScore');
const playerNameInput = document.getElementById('playerName');
const saveScoreBtn = document.getElementById('saveScore');
const closeBoardBtn = document.getElementById('closeBoard');

const buffFileInput = document.getElementById('buffFile');
const fileLabelText = document.getElementById('fileLabelText');

let W = canvas.width, H = canvas.height;
function resizeCanvasForDPR(){
  const ratio = Math.max(1, window.devicePixelRatio || 1);
  const cssW = canvas.clientWidth || 800;
  const cssH = canvas.clientHeight || 520;
  canvas.width = Math.floor(cssW * ratio);
  canvas.height = Math.floor(cssH * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  W = canvas.width / ratio;
  H = canvas.height / ratio;
}
window.addEventListener('resize', resizeCanvasForDPR);
resizeCanvasForDPR();

const playerEmoji = '😃';
const dollarEmoji = '💵';
const player = { x: W/2, y: H/2, r: 22, baseSpeed: 180, speed: 180, vx:0, vy:0 };
let keys = {};
let items = []; // {x,y,type,vx,vy,r, spawnTime}
let score = 0;
let lives = 3;
let lastTime = 0;
let spawnTimer = 0;
let gameOver = false;
let elapsed = 0;

let buffSpawnTimer = 0;
const BUFF_SPAWN_INTERVAL = 30;
const BUFF_LIFETIME = 12;
let invincible = false;
let invTimer = 0;
const INV_DURATION = 10;

// Leaderboard (localStorage)
const STORAGE_KEY = 'smiley_leaderboard_v1';
function loadLeaderboard(){ try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; } catch(e){ return []; } }
function saveLeaderboard(list){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e){} }
function addScoreToLeaderboard(name, scoreVal){
  const list = loadLeaderboard();
  list.push({name: name || 'Игрок', score: scoreVal, date: new Date().toISOString()});
  list.sort((a,b)=> b.score - a.score || new Date(b.date) - new Date(a.date));
  const top = list.slice(0,20);
  saveLeaderboard(top);
  return top;
}
function renderLeaderboard(){
  const list = loadLeaderboard();
  leaderListEl.innerHTML = '';
  if(list.length === 0){ leaderListEl.innerHTML = '<div class="small">Пока нет результатов</div>'; return; }
  list.forEach((it, idx) => {
    const div = document.createElement('div');
    div.className = 'leaderItem';
    const name = document.createElement('div'); name.textContent = `${idx+1}. ${it.name}`;
    const score = document.createElement('div'); score.textContent = it.score;
    div.appendChild(name); div.appendChild(score); leaderListEl.appendChild(div);
  });
}

// Загрузка изображения для бонуса
let buffImage = new Image();
let buffImageLoaded = false;
let buffObjectURL = null;

buffFileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(buffObjectURL) URL.revokeObjectURL(buffObjectURL);
  buffObjectURL = URL.createObjectURL(file);
  buffImage = new Image();
  buffImage.onload = () => {
    buffImageLoaded = true;
    fileLabelText.textContent = 'Изображение загружено';
  };
  buffImage.onerror = () => {
    buffImageLoaded = false;
    fileLabelText.textContent = 'Ошибка загрузки';
  };
  buffImage.src = buffObjectURL;
});

// Управление
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Перезапуск и Leaderboard
restartBtn.addEventListener('click', init);
showBoardBtn.addEventListener('click', ()=> { finalScoreEl.textContent = score; playerNameInput.value = ''; renderLeaderboard(); openModal(); });

function openModal(){ modal.classList.add('show'); playerNameInput.focus(); }
function closeModal(){ modal.classList.remove('show'); }
closeBoardBtn.addEventListener('click', ()=> closeModal());
saveScoreBtn.addEventListener('click', ()=>{
  const name = playerNameInput.value.trim().slice(0,20) || 'Игрок';
  addScoreToLeaderboard(name, score);
  renderLeaderboard();
  finalScoreEl.textContent = score;
  saveScoreBtn.disabled = true;
  playerNameInput.disabled = true;
});

// Инициализация
function init(){
  score = 0; lives = 3; items = []; gameOver = false;
  player.x = W/2; player.y = H/2;
  player.speed = player.baseSpeed;
  elapsed = 0; spawnTimer = 0; buffSpawnTimer = 0;
  invincible = false; invTimer = 0;
  scoreEl.textContent = score; livesEl.textContent = lives; timeEl.textContent = '0.0'; invTimerEl.textContent = '0.0';
  lastTime = performance.now();
  saveScoreBtn.disabled = false; playerNameInput.disabled = false;
  requestAnimationFrame(loop);
}

// Спавн предметов
function spawnItem(typeOverride){
  const edge = Math.floor(Math.random()*4);
  let x = Math.random()*W, y = Math.random()*H;
  if(edge===0){ x = -40; y = Math.random()*H; }
  if(edge===1){ x = W+40; y = Math.random()*H; }
  if(edge===2){ x = Math.random()*W; y = -40; }
  if(edge===3){ x = Math.random()*W; y = H+40; }
  const angle = Math.atan2(player.y - y, player.x - x) + (Math.random()-0.5)*0.8;
  const baseSpeed = 50 + Math.min(220, elapsed * 8);
  const speed = baseSpeed + Math.random()*80;
  const vx = Math.cos(angle)*speed;
  const vy = Math.sin(angle)*speed;
  const redProb = Math.min(0.45, 0.12 + elapsed * 0.01);
  const type = typeOverride || (Math.random() < redProb ? 'red' : 'green');
  const r = type === 'buff' ? 28 : (14 + Math.random()*10);
  items.push({x,y,vx,vy,type,r, spawnTime: elapsed});
}

// Touch support
let touchActive = false;
let touchTarget = { x: player.x, y: player.y };
function setTouchTarget(x, y){ touchActive = true; touchTarget.x = x; touchTarget.y = y; }
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; const rect = canvas.getBoundingClientRect(); setTouchTarget((t.clientX - rect.left), (t.clientY - rect.top)); }, {passive:false});
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; const rect = canvas.getBoundingClientRect(); setTouchTarget((t.clientX - rect.left), (t.clientY - rect.top)); }, {passive:false});
canvas.addEventListener('touchend', (e) => { e.preventDefault(); touchActive = false; }, {passive:false});

// Обновление логики
function update(dt){
  if(gameOver) return;
  elapsed += dt;
  const accel = 12;
  player.speed = player.baseSpeed + elapsed * accel;

  // движение
  if(touchActive){
    const dx = touchTarget.x - player.x;
    const dy = touchTarget.y - player.y;
    const d = Math.hypot(dx,dy) || 1;
    const stopRadius = 6;
    if(d > stopRadius){ player.vx = (dx / d) * player.speed; player.vy = (dy / d) * player.speed; } else { player.vx = 0; player.vy = 0; }
    player.x += player.vx * dt; player.y += player.vy * dt;
  } else {
    let ax=0, ay=0;
    if(keys['arrowleft']||keys['a']) ax = -1;
    if(keys['arrowright']||keys['d']) ax = 1;
    if(keys['arrowup']||keys['w']) ay = -1;
    if(keys['arrowdown']||keys['s']) ay = 1;
    const len = Math.hypot(ax,ay) || 1;
    player.vx = (ax/len) * player.speed; player.vy = (ay/len) * player.speed;
    player.x += player.vx * dt; player.y += player.vy * dt;
  }

  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  // спавн обычных
  spawnTimer += dt;
  const minInterval = 0.18;
  const maxInterval = 0.9;
  const interval = Math.max(minInterval, maxInterval - Math.min(0.7, elapsed * 0.03));
  if(spawnTimer > interval){
    spawnTimer = 0;
    const count = elapsed > 25 ? (Math.random() < 0.4 ? 2 : 1) : 1;
    for(let i=0;i<count;i++) spawnItem();
  }

  // спавн бонуса каждые 30 сек
  buffSpawnTimer += dt;
  if(buffSpawnTimer >= BUFF_SPAWN_INTERVAL){
    buffSpawnTimer = 0;
    spawnItem('buff');
  }

  // обновление предметов и столкновения
  for(let i = items.length-1; i>=0; i--){
    const it = items[i];
    it.x += it.vx * dt; it.y += it.vy * dt;
    it.vx *= 0.998; it.vy *= 0.998;

    if(it.type === 'buff' && (elapsed - it.spawnTime) > BUFF_LIFETIME){ items.splice(i,1); continue; }
    if(it.x < -140 || it.x > W+140 || it.y < -140 || it.y > H+140){ items.splice(i,1); continue; }

    const dx = it.x - player.x, dy = it.y - player.y;
    const dist = Math.hypot(dx,dy);
    if(dist < it.r + player.r*0.6){
      if(it.type === 'green'){
        const bonus = 10 + Math.floor(elapsed/10);
        score += bonus; scoreEl.textContent = score;
      } else if(it.type === 'red'){
        if(!invincible){
          lives -= 1; livesEl.textContent = lives; player.x -= dx*0.6; player.y -= dy*0.6;
          if(lives <= 0){
            gameOver = true;
            setTimeout(()=> { finalScoreEl.textContent = score; renderLeaderboard(); openModal(); }, 120);
          }
        } else {
          score += 2; scoreEl.textContent = score;
        }
      } else if(it.type === 'buff'){
        invincible = true; invTimer = INV_DURATION; invTimerEl.textContent = invTimer.toFixed(1);
        score += 50; scoreEl.textContent = score;
      }
      items.splice(i,1);
    }
  }

  if(invincible){
    invTimer -= dt;
    if(invTimer <= 0){ invincible = false; invTimer = 0; }
    invTimerEl.textContent = invTimer.toFixed(1);
  } else { invTimerEl.textContent = '0.0'; }
}

// Рисование
function draw(){
  ctx.clearRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,0,0,0.12)'); g.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  for(const it of items){
    ctx.beginPath();
    if(it.type === 'green') ctx.fillStyle = '#2ecc71';
    else if(it.type === 'red') ctx.fillStyle = '#e74c3c';
    else if(it.type === 'buff') ctx.fillStyle = '#f1c40f';
    ctx.globalAlpha = 0.95;
    ctx.arc(it.x, it.y, it.r+6, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // рисуем изображение, если это buff и изображение загружено
    if(it.type === 'buff' && buffImageLoaded){
      const size = it.r*2;
      ctx.drawImage(buffImage, it.x - it.r, it.y - it.r, size, size);
      // белая рамка
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.arc(it.x, it.y, it.r+8, 0, Math.PI*2); ctx.stroke();
    } else {
      // рисуем эмодзи (или доллар)
      ctx.font = (it.r+6) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const emoji = it.type === 'buff' ? '🧓' : dollarEmoji;
      ctx.fillText(emoji, it.x, it.y + 2);
    }
  }

  // игрок
  ctx.beginPath(); ctx.fillStyle = '#ffd54f'; ctx.arc(player.x, player.y, player.r+8, 0, Math.PI*2); ctx.fill();
  if(invincible){
    ctx.beginPath(); ctx.lineWidth = 6; ctx.strokeStyle = '#2ecc71'; ctx.arc(player.x, player.y, player.r+12, 0, Math.PI*2); ctx.stroke();
  }
  ctx.font = (player.r+8) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(playerEmoji, player.x, player.y + 2);

  if(gameOver){
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff'; ctx.font = '34px Arial'; ctx.textAlign = 'center'; ctx.fillText('Игра окончена', W/2, H/2 - 20);
    ctx.font = '18px Arial'; ctx.fillText('Открой Leaderboard, чтобы сохранить результат', W/2, H/2 + 12);
  }
}

// Главный цикл
function loop(ts){
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  update(dt); draw(); timeEl.textContent = elapsed.toFixed(1);
  if(!gameOver) requestAnimationFrame(loop);
}

// Старт
init();

// Модалка закрытие по клику вне
modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
playerNameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') saveScoreBtn.click(); });

// Предзаполнить лидерборд при первом запуске
if(loadLeaderboard().length === 0){
  const demo = [{name:'Alex', score:420},{name:'Mira', score:360},{name:'Sam', score:300},{name:'Lena', score:260},{name:'Ivan', score:220}];
  saveLeaderboard(demo);
}

// Кнопка полноэкран
const fsBtn = document.createElement('button');
fsBtn.textContent = 'Полноэкран'; fsBtn.className = 'btn'; fsBtn.style.marginLeft = '6px';
fsBtn.addEventListener('click', async () => { try { if(!document.fullscreenElement) await canvas.requestFullscreen(); else await document.exitFullscreen(); } catch(e){} });
document.querySelector('.hud').appendChild(fsBtn);
</script>
</body>
</html>
